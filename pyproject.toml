[project]
name = "noteguard"
version = "0.1.0"
description = "Read-only record reconciliation layer for one patient encounter (synthetic data only)."
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.7",
  "uvicorn==0.34.3",
  "pdfplumber==0.11.7",
  "python-multipart==0.0.20",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "httpx==0.28.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noteguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "owner(lane): lane that owns this test (Section 18.5)",
  "engine: engine-level test (make test-engine)",
  "api: API-level test (make test-api)",
  "contract: B0 contract/seam test",
  "governance: B4 governance / AI gate test (make test-governance)",
  "ui: B3 UI test placeholder (real UI tests live in frontend/)",
  "e2e: end-to-end smoke (I1)",
]
